<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entrada con clave</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#14213D;background:#EEF1F8}
a{color:#14213D;text-decoration:none}a:hover{color:#0b1426}
.num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input:focus{outline:3px solid #FF9F1C;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #14213D; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif">
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px; padding: 32px 24px">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px">
      <span style="width: 72px; height: 72px; border-radius: 22px; background: #FF9F1C; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/></svg>
      </span>
      <h1 class="num" style="margin: 0; font-size: 40px; font-weight: 800; line-height: 1.05">Mi cocina</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.45; font-weight: 500; color: #C9D1E4">Escribe tu clave para ver tus compras, platos y producciones en este dispositivo.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 700">Clave</span>
        <span style="{{fieldStyle}}">
          <input type="{{inputType}}" value="{{key}}" onChange="{{onKey}}" autocomplete="current-password" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #14213D; font-size: 20px; font-weight: 700; letter-spacing: 0.06em">
          <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 48px; height: 48px; border: none; border-radius: 12px; background: #EEF1F8; color: #14213D; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>
      <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
        <span role="alert" style="display: flex; align-items: center; gap: 8px; background: #FFE8C7; color: #5C2E00; border-radius: 12px; padding: 10px 12px; font-size: 15px; font-weight: 700">Esa clave no es la buena. Prueba otra vez.</span>
      </sc-if>
      <a href="Main.dc.html" style="height: 64px; border-radius: 20px; background: #FF9F1C; color: #14213D; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
        Entrar
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
  </div>
  <p style="margin: 0; padding: 0 24px 36px; font-size: 14px; line-height: 1.45; font-weight: 500; color: #C9D1E4; text-align: center">Solo te la pedimos la primera vez en cada dispositivo.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"error":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { key: '', show: false };
  }
  renderVals() {
    const err = !!(this.props.error ?? false);
    return {
      key: this.state.key,
      onKey: e => this.setState({ key: e.target.value }),
      inputType: this.state.show ? 'text' : 'password',
      toggle: () => this.setState({ show: !this.state.show }),
      toggleLabel: this.state.show ? 'Ocultar clave' : 'Mostrar clave',
      showError: err,
      fieldStyle: 'display:flex;align-items:center;gap:8px;height:64px;border-radius:18px;background:#FFFFFF;padding:0 8px 0 18px;box-sizing:border-box;border:3px solid ' + (err ? '#FF9F1C' : '#FFFFFF')
    };
  }
}
</script>
</body>
</html>
