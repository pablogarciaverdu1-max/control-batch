<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#14213D;background:#EEF1F8}
a{color:#14213D;text-decoration:none}a:hover{color:#0b1426}
.num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EEF1F8; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #14213D">
  <main style="flex: 1; overflow-y: auto; padding: 24px 20px 24px; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; font-weight: 600; color: #4A5672">Domingo, 11 de octubre</span>
        <h1 class="num" style="margin: 0; font-size: 34px; font-weight: 800; line-height: 1.05">Mi cocina</h1>
        <span role="status" style="{{syncPill}}">
          <sc-if value="{{isOffline}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M8.5 8.6A5 5 0 0 0 6 18h11"/><path d="M12.6 6.1A5.5 5.5 0 0 1 17.5 11 3.5 3.5 0 0 1 20 16.6"/></svg>
          </sc-if>
          <sc-if value="{{isOnline}}" hint-placeholder-val="{{ true }}">
            <span style="{{syncDot}}"></span>
          </sc-if>
          {{syncLabel}}
        </span>
      </div>
      <a href="Ajustes.dc.html" aria-label="Ajustes" style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </header>

    <a href="Produccion.dc.html" style="display: flex; align-items: center; gap: 16px; background: #FF9F1C; color: #14213D; border-radius: 24px; padding: 22px 22px; min-height: 92px; box-sizing: border-box; box-shadow: 0 10px 24px rgba(255,159,28,0.35)">
      <span style="width: 56px; height: 56px; border-radius: 18px; background: #14213D; color: #FF9F1C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span class="num" style="font-size: 24px; font-weight: 800">Nueva producción</span>
        <span style="font-size: 15px; font-weight: 600">Elige plato y ajusta cantidades</span>
      </span>
    </a>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 19px; font-weight: 700">Últimas producciones</h2>
        <a href="Historial.dc.html" style="font-size: 15px; font-weight: 700; color: #14213D; padding: 10px 0">Ver todas</a>
      </div>
      <sc-for list="{{recent}}" as="p" hint-placeholder-count="4">
        <a href="ProduccionDetalle.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFFFFF; border-radius: 20px; padding: 16px 18px; min-height: 76px; box-sizing: border-box">
          <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 17px; font-weight: 700; line-height: 1.25">{{p.name}}</span>
            <span style="font-size: 14px; font-weight: 500; color: #4A5672">{{p.date}} · {{p.portions}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0">
            <span class="num" style="font-size: 26px; font-weight: 800; line-height: 1">{{p.price}}</span>
            <span style="font-size: 12px; font-weight: 600; color: #4A5672">por ración</span>
          </span>
        </a>
      </sc-for>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="Compras.dc.html" style="display: flex; flex-direction: column; gap: 14px; background: #14213D; color: #FFFFFF; border-radius: 22px; padding: 18px; min-height: 128px; box-sizing: border-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF9F1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span class="num" style="font-size: 22px; font-weight: 800">Compras</span>
          <span style="font-size: 14px; font-weight: 500; color: #C9D1E4">22 productos</span>
        </span>
      </a>
      <a href="Platos.dc.html" style="display: flex; flex-direction: column; gap: 14px; background: #14213D; color: #FFFFFF; border-radius: 22px; padding: 18px; min-height: 128px; box-sizing: border-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF9F1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span class="num" style="font-size: 22px; font-weight: 800">Platos</span>
          <span style="font-size: 14px; font-weight: 500; color: #C9D1E4">5 recetas</span>
        </span>
      </a>
    </section>
  </main>

  <nav aria-label="Navegación principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DCE2EE; padding: 8px 8px 22px">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #14213D; font-size: 13px; font-weight: 700">
      <span style="background: #FF9F1C; border-radius: 14px; padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Inicio
    </a>
    <a href="Compras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #4A5672; font-size: 13px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg></span>Compras
    </a>
    <a href="Platos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #4A5672; font-size: 13px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/></svg></span>Platos
    </a>
    <a href="Historial.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #4A5672; font-size: 13px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Historial
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sync":{"editor":"enum","options":["guardado","guardando","sin conexión"],"default":"guardado"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sync = this.props.sync ?? 'guardado';
    const offline = sync === 'sin conexión';
    const base = 'align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:700;';
    return {
      isOffline: offline, isOnline: !offline,
      syncLabel: sync === 'guardado' ? 'Guardado' : (sync === 'guardando' ? 'Guardando…' : 'Sin conexión, se guardará al volver'),
      syncPill: base + (offline ? 'background:#FFE8C7;color:#7A3E00' : 'background:#FFFFFF;color:#14213D'),
      syncDot: 'width:8px;height:8px;border-radius:50%;background:' + (sync === 'guardado' ? '#2E8B57' : '#FF9F1C'),
      recent: [
        { name: 'Pollo al curry', date: '[fecha]', portions: '4 raciones', price: '1,10 €' },
        { name: 'Albóndigas en salsa con guisantes', date: '[fecha]', portions: '30 albóndigas', price: '1,70 €' },
        { name: 'Guiso de garbanzos con pollo', date: '[fecha]', portions: '4 raciones', price: '3,00 €' },
        { name: 'Arroz con pollo y verduras', date: '[fecha]', portions: '4 raciones', price: '0,70 €' }
      ]
    };
  }
}
</script>
</body>
</html>
