<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Platos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#14213D;background:#EEF1F8}
a{color:#14213D;text-decoration:none}a:hover{color:#0b1426}
.num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EEF1F8; display: flex; flex-direction: column; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #14213D">
  <header style="padding: 28px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 class="num" style="margin: 0; font-size: 34px; font-weight: 800">Platos</h1>
      <span style="font-size: 15px; font-weight: 500; color: #4A5672">Coste por ración con los precios de hoy</span>
    </div>
    <a href="PlatoEditor.dc.html" style="height: 56px; padding: 0 16px 0 12px; border-radius: 18px; background: #FF9F1C; color: #14213D; display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 16px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nuevo plato
    </a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{dishes}}" as="d" hint-placeholder-count="5">
      <a href="Plato.dc.html" style="display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border-radius: 22px; padding: 18px; box-sizing: border-box">
        <span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
          <span style="font-size: 19px; font-weight: 700; line-height: 1.25">{{d.name}}</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5672" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="m9 18 6-6-6-6"/></svg>
        </span>
        <span style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
          <span style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500; color: #4A5672">
            <span>{{d.ingredients}} ingredientes · salen {{d.portions}}</span>
            <sc-if value="{{d.hasUnit}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; background: #FFE8C7; color: #7A3E00; border-radius: 8px; padding: 3px 8px; font-size: 13px; font-weight: 700">{{d.unitCost}}</span></sc-if>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end">
            <span class="num" style="font-size: 30px; font-weight: 800; line-height: 1">{{d.cost}}</span>
            <span style="font-size: 12px; font-weight: 600; color: #4A5672">coste por ración</span>
          </span>
        </span>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Navegación principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DCE2EE; padding: 8px 8px 22px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #4A5672; font-size: 13px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Inicio
    </a>
    <a href="Compras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #4A5672; font-size: 13px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg></span>Compras
    </a>
    <a href="Platos.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #14213D; font-size: 13px; font-weight: 700">
      <span style="background: #FF9F1C; border-radius: 14px; padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/></svg></span>Platos
    </a>
    <a href="Historial.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 56px; box-sizing: border-box; color: #4A5672; font-size: 13px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Historial
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dishes: [
        { name: 'Pollo al curry', ingredients: 5, portions: '4 raciones', cost: '1,02 €', hasUnit: false },
        { name: 'Albóndigas en salsa con guisantes', ingredients: 8, portions: '30 albóndigas (6 raciones)', cost: '1,66 €', hasUnit: true, unitCost: '0,33 € por albóndiga' },
        { name: 'Guiso de garbanzos con pollo', ingredients: 8, portions: '4 raciones', cost: '2,91 €', hasUnit: false },
        { name: 'Arroz con pollo y verduras', ingredients: 6, portions: '4 raciones', cost: '0,62 €', hasUnit: false },
        { name: 'Pollo al horno con patatas', ingredients: 4, portions: '4 raciones', cost: '1,44 €', hasUnit: false }
      ]
    };
  }
}
</script>
</body>
</html>
